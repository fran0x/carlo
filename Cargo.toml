[workspace]
resolver = "3"
members = ["crates/carlo", "crates/carlo-py", "crates/carlo-live"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
carlo = { path = "crates/carlo" }
rayon = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# Same as release without the slow link-time steps, for comparing their effect.
[profile.release-fast-build]
inherits = "release"
lto = false
codegen-units = 16
