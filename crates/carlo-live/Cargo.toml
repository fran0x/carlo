[package]
name = "carlo-live"
version = "0.1.0"
description = "Live Deribit ticker feed: reprice on every update and measure latency"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
core_affinity = "0.8.3"
futures-util = "0.3.34"
hdrhistogram = "7.6.0"
carlo.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
